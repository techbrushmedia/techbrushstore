<div x-data="{ open: localStorage.getItem('cookie-consent') === null }" x-show="open" x-cloak class="fixed inset-x-0 bottom-0 z-50 p-4">
  <div class="mx-auto flex max-w-4xl flex-col gap-4 border border-gray-300 bg-white p-5 shadow-xl md:flex-row md:items-center md:justify-between">
    <p class="text-sm leading-6 text-gray-700">We use essential cookies to keep the store secure and your cart working. You can read more in our <a href="{% url 'privacy' %}" class="font-semibold text-black underline">Privacy policy</a>.</p>
    <div class="flex shrink-0 gap-3">
      <button type="button" @click="localStorage.setItem('cookie-consent', 'essential'); open = false" class="border border-black px-4 py-2 text-sm font-semibold hover:bg-gray-100">Essential only</button>
      <button type="button" @click="localStorage.setItem('cookie-consent', 'accepted'); open = false" class="bg-black px-4 py-2 text-sm font-semibold text-white hover:bg-gray-800">Accept</button>
    </div>
  </div>
</div>
